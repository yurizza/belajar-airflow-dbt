services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"  # 👈 Dibuka agar DBeaver dari laptop bisa masuk
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}  # 👈 Ini otomatis jadi database utama (airflow_metadata)
    volumes:
      - postgres_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  airflow-scheduler:
    build: .
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - _AIRFLOW_DB_MIGRATE=true
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./raw_data:/opt/airflow/raw_data
      - ./dbt_project:/opt/airflow/dbt_project   # ✅ perbaikan di sini
    depends_on:
      - postgres
      - redis

  airflow-webserver:
    build: .
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - _AIRFLOW_DB_MIGRATE=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./raw_data:/opt/airflow/raw_data
      - ./dbt_project:/opt/airflow/dbt_project   # ✅ perbaikan di sini
    depends_on:
      - airflow-scheduler

  airflow-worker:
    build: .
    ports:
      - "8081:8081"
    command: airflow celery worker --concurrency 2
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - _AIRFLOW_DB_MIGRATE=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key
      - AIRFLOW__WEBSERVER__WORKER_TIMEOUT=300
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./raw_data:/opt/airflow/raw_data
      - ./dbt_project:/opt/airflow/dbt_project   # ✅ perbaikan di sini
    depends_on:
      - airflow-scheduler

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_PORT=5432
      - MB_DB_USER=${POSTGRES_USER}
      - MB_DB_PASS=${POSTGRES_PASSWORD}
      - MB_DB_HOST=postgres
      - MB_DB_DBNAME=postgres  # 👈 Biarkan ini tetap 'postgres' untuk metadata internal Metabase
    volumes:
      - ./metabase_data:/metabase.db
    depends_on:
      - postgres
      
volumes:
  postgres_db:
